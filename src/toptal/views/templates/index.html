<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
<link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
<h1>{{ title }}</h1>
<div id="log"></div>
<form id="f">
  <select id="provider">
    <option value="">default ({{ default_provider }})</option>
    {% for p in providers %}<option>{{ p }}</option>{% endfor %}
  </select>
  <input id="q" type="text" placeholder="Ask something..." autocomplete="off" required>
  <button>Send</button>
</form>
<script src="{{ url_for('static', path='chat.js') }}"></script>
</body>
</html>
